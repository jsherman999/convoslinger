<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>convoslinger</title>
<meta name="color-scheme" content="dark">
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="bar">
  <div class="brand">convoslinger</div>
  <div class="bar-meta" id="gitmeta"></div>
  <div class="bar-actions">
    <a class="btn ghost" id="preview-site" href="/site/index.html" target="_blank" rel="noopener">preview site</a>
    <button class="btn" id="save">Save &amp; rebuild</button>
    <button class="btn primary" id="publish">Publish</button>
  </div>
</header>

<div id="toast" class="toast" hidden></div>

<main>
  <section class="panel">
    <h2>Site</h2>
    <div class="grid-2">
      <label>Title<input id="site-title" type="text"></label>
      <label>Tagline<input id="site-tagline" type="text"></label>
      <label>Footer <span class="hint">markdown ok</span><input id="site-footer" type="text"></label>
      <label>Order
        <select id="site-sort">
          <option value="date">newest first</option>
          <option value="manual">manual (the order below)</option>
        </select>
      </label>
    </div>
  </section>

  <section class="panel" id="inbox-panel" hidden>
    <h2>Inbox <span class="hint">dropped in by the phone shortcut</span></h2>
    <div id="inbox"></div>
  </section>

  <section class="panel">
    <h2>Add a conversation</h2>
    <div class="drop" id="drop">
      <input type="file" id="file" accept=".md,.txt,.jsonl,.html,.htm" hidden>
      Drop a saved conversation here, <button class="link" id="pick">choose a file</button>, or paste below.
    </div>
    <textarea id="paste" rows="6" placeholder="…or paste the conversation text"></textarea>
    <div class="grid-2">
      <label>Title <span class="hint">blank = guess from the first message</span><input id="new-title" type="text"></label>
      <label>Date<input id="new-date" type="date"></label>
      <label class="wide">Your question <span class="hint">the app copies only Claude&#39;s reply — paste or type what you asked, and the page reads as an exchange</span><textarea id="new-prompt" rows="2"></textarea></label>
      <label class="wide">Synopsis<textarea id="new-synopsis" rows="2"></textarea></label>
      <label>Tags <span class="hint">comma separated</span><input id="new-tags" type="text"></label>
      <div class="checks">
        <label class="check"><input type="checkbox" id="new-visible" checked> publish immediately</label>
        <label class="check"><input type="checkbox" id="new-scrub" checked> redact anything that looks like a credential</label>
        <label class="check"><input type="checkbox" id="new-thinking"> keep thinking blocks (.jsonl)</label>
      </div>
    </div>
    <div class="row-actions">
      <button class="btn" id="ai-new" hidden>Ask Claude for a title &amp; synopsis</button>
      <button class="btn primary" id="add">Add conversation</button>
      <span class="hint" id="add-note"></span>
    </div>
  </section>

  <section class="panel">
    <h2>Conversations <span class="hint" id="counts"></span></h2>
    <div id="list"></div>
  </section>
</main>

<template id="row-template">
  <article class="convo">
    <div class="convo-head">
      <label class="check"><input type="checkbox" data-field="visible"> shown</label>
      <label class="check"><input type="checkbox" data-field="pinned"> pinned</label>
      <span class="id" data-role="id"></span>
      <span class="spacer"></span>
      <button class="icon" data-act="up" title="move up">↑</button>
      <button class="icon" data-act="down" title="move down">↓</button>
      <a class="icon" data-act="open" target="_blank" rel="noopener" title="preview page">↗</a>
      <button class="icon" data-act="ai" title="ask Claude for a title &amp; synopsis">✦</button>
      <button class="icon danger" data-act="del" title="delete">✕</button>
    </div>
    <input class="title" type="text" data-field="title" placeholder="title">
    <textarea class="synopsis" rows="2" data-field="synopsis" placeholder="synopsis shown on the index page"></textarea>
    <div class="convo-foot">
      <input type="date" data-field="date">
      <input type="text" data-field="tags" placeholder="tags, comma separated">
    </div>
  </article>
</template>

<script src="/app.js"></script>
</body>
</html>
