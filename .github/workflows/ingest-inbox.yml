# Turns anything pushed into inbox/ on this branch into a hidden draft.
#
# This branch holds only content, so the workflow checks the app out beside it:
# the app lands in app/, this branch lands in app/content/, which is exactly the
# layout convoslinger expects (see convoslinger/paths.py).
name: Ingest inbox

on:
  push:
    paths:
      - "inbox/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-inbox
  cancel-in-progress: false

env:
  APP_BRANCH: main

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the app
        uses: actions/checkout@v4
        with:
          ref: ${{ env.APP_BRANCH }}
          path: app

      - name: Check out this content branch beside it
        uses: actions/checkout@v4
        with:
          path: app/content

      - name: Import everything waiting in the inbox
        working-directory: app
        run: python3 ./convo inbox --take all --hidden

      - name: Commit the drafts
        working-directory: app/content
        run: |
          if [ -z "$(git status --porcelain -- docs sources inbox)" ]; then
            echo "nothing to ingest"
            exit 0
          fi
          git config user.name "convoslinger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs sources inbox
          git commit -m "Ingest inbox drafts"
          git push
