# Turns anything pushed into inbox/ into a hidden draft conversation.
#
# This is the "phone alone" path: a shortcut drops a markdown file into inbox/,
# this workflow converts it and commits the result as **hidden**. Nothing
# reaches the public index until you flip it to shown in the management app.
name: Ingest inbox

on:
  push:
    paths:
      - "inbox/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ingest-inbox
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Import everything waiting in the inbox
        run: python3 ./convo inbox --take all --hidden

      - name: Commit the drafts
        run: |
          if [ -z "$(git status --porcelain -- docs sources inbox)" ]; then
            echo "nothing to ingest"
            exit 0
          fi
          git config user.name "convoslinger"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- docs sources inbox
          git commit -m "Ingest inbox drafts"
          git push
