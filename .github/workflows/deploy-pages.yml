# Publishes docs/ to GitHub Pages.
#
# One-time setup: Settings -> Pages -> Source: **GitHub Actions**. That has to
# be done by a human, because creating a Pages site needs administration:write
# and the workflow's GITHUB_TOKEN cannot hold that scope (configure-pages'
# `enablement: true` fails with "Resource not accessible by integration").
# Deploying to a site that already exists only needs pages:write, which is why
# every push after that toggle works unattended.
name: Deploy site

on:
  push:
    paths:
      - "docs/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deploys race; let an in-flight one finish rather than cancel it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Whatever the default branch is called — survives renaming it to main.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Fails with "Get Pages site failed ... Not Found" until Pages is set to
      # GitHub Actions in Settings; see the note at the top of this file.
      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload docs/ as the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
